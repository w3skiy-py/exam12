<!DOCTYPE html>
<html>
<body>
    <h1>Доступные курсы</h1>
    {% for course in courses %}
    <div style="margin-bottom: 10px; padding: 10px;">
        <h3>{{ course.title }}</h3>
        <form method="post">
            <input type="hidden" name="course_id" value="{{ course.id }}">
            <textarea name="message" placeholder="Ваш комментарий"></textarea><br>
            <button type="submit">Записаться на курс</button>
        </form>
    </div>
    {% endfor %}
    <br>
    <a href="{{ url_for('user_page') }}">Перейти в мой профиль</a>
</body>
</html>
