<!DOCTYPE html>
<html>
<body>
    <h1>Список курсов</h1>
    <a href="{{ url_for('my_applications') }}">Мои заявки</a>
    <hr>

    {% for course in courses %}
        <div style="border:1px solid #ccc; padding:10px; margin-bottom:10px;">
            <h2>{{ course.title }}</h2>
            <a href="{{ url_for('course_detail', course_id=course.id) }}">Подробнее / Подать заявку</a>
        </div>
    {% endfor %}
</body>
</html>
